[project]
name = "estimador-cag"
version = "0.1.0"
description = "Servicio FastAPI que genera estimaciones de software a partir de una transcripcion de reunion, usando arquitectura CAG (contexto estatico inyectado en el prompt)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.38.0",
    "jinja2>=3.1.0",
    "requests>=2.32.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
